<!-- ===================== DARK MODE BUTTON ===================== -->
<!-- The script below is a tiny program. It swaps the page colors -->
<!-- when you click the button.                                    -->
<p style="text-align: center;"><button onclick="toggleDark()">Dark mode on / off</button></p>
<script>
  // change these two colors
  var lightBackground = "lightgray";
  var darkBackground = "#333333";
  var dark = false;
  document.body.style.backgroundColor = lightBackground;
  function toggleDark() {
    dark = !dark;
    document.body.style.backgroundColor = dark ? darkBackground : lightBackground;
    document.body.style.color = dark ? "white" : "black";
  }
</script>
